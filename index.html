<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Music Nerd Club</title>
<meta name="description" content="Music Nerd Club prototype: a members-only hardware-style TV for C.Y. Lee's portfolio. Weekly drops, spins, tapes and the portfolio wire.">
<link rel="icon" href="assets/specs.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="room" id="room">
  <div class="floor-shadow" id="floorShadow"></div>
  <div class="device" id="device" aria-label="Music Nerd Club device">
    <div class="shell">
      <div class="grain"></div>
      <div class="seam"></div>
      <div class="sheen" id="sheen"></div>
      <span class="screw s1"></span><span class="screw s2"></span><span class="screw s3"></span><span class="screw s4"></span>

      <header class="top">
        <img class="specs" src="assets/specs.png" alt="Music Nerd specs logo">
        <div class="brandstack">
          <div class="nameplate" aria-label="Music Nerd Club"><span class="np-t">music nerd <b>club</b></span><span class="np-sheen" aria-hidden="true"></span></div>
          <div class="etch model">model 01 · members only</div>
        </div>
        <div class="lamp" id="lamp"><span class="lamp-glass"></span><span class="lamp-txt" id="lampTxt">on air</span></div>
        <div class="etch status" id="statusEtch">members only</div>
        <div class="swgroup"><span class="etch">skills rec</span><button class="toggle on" id="skillsSw" aria-label="Skills rec: turn chats into playbooks"><span class="tg-lever"></span></button></div>
        <div class="swgroup"><span class="etch">power</span><button class="power" id="power" aria-label="Power"><span class="power-lever"></span></button></div>
      </header>

      <section class="well screen-well">
        <div class="screen" id="screen">
          <div class="crt" id="crt">
            <div class="view" id="view"></div>
            <div class="static-ov" id="staticOv"></div>
            <div class="fx-reacts" id="reacts"></div>
          </div>
          <div class="scan"></div><div class="mask"></div><div class="vignette"></div>
          <div class="glass" id="glass"></div>
          <div class="poweroff" id="powerOff">
            <div class="boot">
              <img src="assets/specs.png" alt="">
              <div class="boot-t">music nerd <b>club</b></div>
              <div class="boot-s">press power or tap to turn on</div>
            </div>
          </div>
        </div>
      </section>

      <nav class="strip well" id="strip" aria-label="Channels"></nav>

      <aside class="panel">
        <div class="lcd well" id="lcd">
          <div class="lcd-cell"><div class="seg ghost">88</div><div class="seg" id="lcdA">12</div><div class="lcd-l" id="lcdAl">min</div></div>
          <div class="lcd-mid" id="lcdMid"></div>
          <div class="lcd-cell r"><div class="seg ghost p">88</div><div class="seg p" id="lcdB">00</div><div class="lcd-l p" id="lcdBl">sec</div></div>
        </div>

        <div class="deck">
          <button class="key" data-k="0"><span class="cap"><span class="ico" id="k0i"></span></span><span class="led"></span><span class="legend" id="k0l"></span></button>
          <button class="key" data-k="1"><span class="cap"><span class="ico" id="k1i"></span></span><span class="led"></span><span class="legend" id="k1l"></span></button>
          <div class="kn big" id="kMatch"><div class="scale"></div>
            <button class="knob" aria-label="Match: turn to pick who, press to call someone grinding"><span class="knurl"></span><span class="cap-metal"></span><span class="ind"></span><span class="knob-lab">match</span></button>
          </div>
          <button class="key" data-k="2"><span class="cap"><span class="ico" id="k2i"></span></span><span class="led"></span><span class="legend" id="k2l"></span></button>
          <button class="key dark" data-k="3"><span class="cap"><span class="ico" id="k3i"></span></span><span class="led"></span><span class="legend" id="k3l"></span></button>
        </div>

        <div class="minis">
          <div class="kn mini chicken" id="kAir"><div class="scale"></div><button class="knob" aria-label="On air: start or end"><span class="knurl"></span><span class="cap-metal"></span><span class="ind"></span></button><div class="kn-l">on air</div></div>
          <div class="kn mini" id="kTimer"><div class="scale"></div><button class="knob" aria-label="Timer: turn to set minutes, press to start or pause"><span class="knurl"></span><span class="cap-metal"></span><span class="ind"></span></button><div class="kn-l">timer</div></div>
          <div class="kn mini" id="kVol"><div class="scale"></div><button class="knob" aria-label="Volume"><span class="knurl"></span><span class="cap-metal"></span><span class="ind"></span></button><div class="kn-l">volume</div></div>
          <div class="kn mini red" id="kAdlib"><div class="scale"></div><button class="knob" aria-label="Adlib: turn to pick, press to fire"><span class="knurl"></span><span class="cap-metal"></span><span class="ind"></span></button><div class="kn-l">adlib</div></div>
        </div>

        <div class="vu well" id="vu"></div>
      </aside>

      <footer class="marq well" id="marq"><div class="marq-run" id="marqRun"></div><div class="dots"></div></footer>
      <img class="plate" src="assets/wordmark.png" alt="Music Nerd">
      <div class="etch proto">prototype · demo data</div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="hint" id="hint"><span><kbd>←</kbd><kbd>→</kbd> surf</span><span><kbd>space</kbd> match</span><span><kbd>o</kbd> on air</span><span><kbd>a</kbd> adlib</span><span><kbd>k</kbd> skills</span><span><kbd>g</kbd> guide</span></div>
</div>
<script src="app.js"></script>
</body>
</html>
